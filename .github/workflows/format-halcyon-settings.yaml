name: Format Halcyon settings branch

on:
  push:
    branches:
      - feat/halcyon-settings-protocol

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - name: Checkout userspace branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/halcyon-settings-protocol
          fetch-depth: 0
          path: userspace

      - name: Checkout pinned Vial-QMK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware

      - name: Configure QMK CLI
        run: |
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE/userspace

      - name: Correct protocol state invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("userspace/keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_settings_protocol.c")
          text = path.read_text()

          old_sync = "sync_persist = sync_persist || persist;"
          new_sync = "sync_persist = persist;"
          if old_sync not in text:
              raise SystemExit("expected sync persistence expression not found")
          text = text.replace(old_sync, new_sync, 1)

          old_timing = (
              "return pattern_frame_ms >= XTREEMZE_HALCYON_PATTERN_MS_MIN && pattern_frame_ms <= XTREEMZE_HALCYON_PATTERN_MS_MAX &&\n"
              "           mod_recent_ms >= XTREEMZE_HALCYON_MOD_RECENT_MS_MIN && mod_recent_ms <= XTREEMZE_HALCYON_MOD_RECENT_MS_MAX;"
          )
          new_timing = (
              "return pattern_frame_ms >= XTREEMZE_HALCYON_PATTERN_MS_MIN && pattern_frame_ms <= XTREEMZE_HALCYON_PATTERN_MS_MAX &&\n"
              "           mod_recent_ms <= XTREEMZE_HALCYON_MOD_RECENT_MS_MAX;"
          )
          if old_timing not in text:
              raise SystemExit("expected timing bounds expression not found")
          path.write_text(text.replace(old_timing, new_timing, 1))
          PY

      - name: Apply QMK clang-format
        run: |
          qmk format-c \
            userspace/users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.c \
            userspace/users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.h

      - name: Commit deterministic fixes
        run: |
          if git -C "$GITHUB_WORKSPACE/userspace" diff --quiet; then
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE/userspace" config user.name github-actions[bot]
          git -C "$GITHUB_WORKSPACE/userspace" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$GITHUB_WORKSPACE/userspace" add \
            keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_settings_protocol.c \
            users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.c \
            users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.h
          git -C "$GITHUB_WORKSPACE/userspace" commit -m "Fix and format Halcyon settings protocol"
          git -C "$GITHUB_WORKSPACE/userspace" push origin HEAD:feat/halcyon-settings-protocol
