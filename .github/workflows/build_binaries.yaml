name: Build QMK firmware

on:
  push:
    branches: [halcyon]
  pull_request:
    branches: [halcyon]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    name: 'Halcyon Regression Suite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Userspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned Vial-QMK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware

      - name: Apply userspace QMK patch
        run: |
          git -C qmk_firmware apply --check ../patches/0001-os-detection-fingerprint-trace.patch
          git -C qmk_firmware apply ../patches/0001-os-detection-fingerprint-trace.patch

      - name: Run standalone regressions
        run: bash tests/run_ci_regressions.sh

  build:
    name: 'QMK Userspace Build'
    permissions:
      contents: read
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@01daf5113fa50804558f21cc074ab99ba84ddeaf
    with:
      qmk_repo: vial-kb/vial-qmk
      qmk_ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
      preparation_command: >-
        ln -s "$GITHUB_WORKSPACE/converters/promicro_to_halcyon/" qmk_firmware/platforms/chibios/converters/ &&
        git -C qmk_firmware apply --check ../patches/0001-os-detection-fingerprint-trace.patch &&
        git -C qmk_firmware apply ../patches/0001-os-detection-fingerprint-trace.patch

  publish:
    name: 'QMK Userspace Publish'
    permissions:
      contents: write
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@01daf5113fa50804558f21cc074ab99ba84ddeaf
    if: github.ref == 'refs/heads/halcyon' && needs.build.result == 'success' && needs.regressions.result == 'success'
    needs: [build, regressions]
    with:
      release_name: latest
