name: Format Halcyon TFT editor branch

on:
  push:
    branches:
      - feat/halcyon-tft-editor-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - name: Checkout userspace branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/halcyon-tft-editor-v2
          fetch-depth: 0
          path: userspace

      - name: Checkout pinned Vial-QMK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware

      - name: Configure QMK CLI
        run: |
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE/userspace

      - name: Apply QMK clang-format
        run: |
          qmk format-c \
            userspace/keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/config.h \
            userspace/keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_display_protocol.c \
            userspace/keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_display_protocol.h \
            userspace/keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_settings_protocol.c \
            userspace/users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.c \
            userspace/users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.h

      - name: Commit deterministic formatting
        run: |
          if git -C "$GITHUB_WORKSPACE/userspace" diff --quiet; then
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE/userspace" config user.name github-actions[bot]
          git -C "$GITHUB_WORKSPACE/userspace" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$GITHUB_WORKSPACE/userspace" add \
            keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/config.h \
            keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_display_protocol.c \
            keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_display_protocol.h \
            keyboards/splitkb/halcyon/ferris/keymaps/xtreemze_final/halcyon_settings_protocol.c \
            users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.c \
            users/halcyon_modules/splitkb/hlc_tft_display/hlc_tft_display.h
          git -C "$GITHUB_WORKSPACE/userspace" commit -m "Format Halcyon TFT editor firmware"
          git -C "$GITHUB_WORKSPACE/userspace" push origin HEAD:feat/halcyon-tft-editor-v2
