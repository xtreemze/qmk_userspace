name: Deploy Ferris layer visualizer

on:
  push:
    branches:
      - halcyon
    paths:
      - 'docs/visualizer/**'
      - '.github/workflows/pages-visualizer.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload visualizer artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/visualizer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
