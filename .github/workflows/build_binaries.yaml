name: Build QMK firmware

on:
  push:
    branches: [halcyon]
  pull_request:
    branches: [halcyon]
  workflow_dispatch:

# Compilation and regression checks are read-only. Only the release job below
# receives write authority, because publishing updates the `latest` release/tag.
permissions:
  contents: read

jobs:
  regressions:
    name: 'Halcyon Regression Suite'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Userspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned Vial-QMK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware

      - name: Apply userspace QMK patches
        run: bash scripts/apply-qmk-patches.sh qmk_firmware

      - name: Run standalone regressions
        run: bash tests/run_ci_regressions.sh

  build:
    name: 'QMK Userspace Build'
    runs-on: ubuntu-24.04
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    permissions:
      contents: read
    steps:
      - name: Checkout Userspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Checkout pinned Vial-QMK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vial-kb/vial-qmk
          ref: dd43959ae5c08d8a28d38a1acf7b04e86b14a344
          path: qmk_firmware
          submodules: recursive

      - name: Configure QMK CLI
        run: |
          qmk config userspace_compile.parallel=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null)
          qmk config user.qmk_home=$GITHUB_WORKSPACE/qmk_firmware
          qmk config user.overlay_dir=$GITHUB_WORKSPACE

      - name: Validate userspace
        run: qmk userspace-doctor

      - name: Check formatting and apply userspace QMK patches
        run: |
          bash scripts/check-changed-firmware-format.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            "${{ github.event.pull_request.number }}"
          ln -s "$GITHUB_WORKSPACE/converters/promicro_to_halcyon/" qmk_firmware/platforms/chibios/converters/
          bash scripts/apply-qmk-patches.sh qmk_firmware

      - name: Build
        run: |
          if qmk userspace-compile --help | grep -q "print-failures"; then
              EXTRA_ARGS="-p"
          fi
          qmk userspace-compile -e DUMP_CI_METADATA=yes $EXTRA_ARGS || touch .failed
          ./qmk_firmware/util/ci/generate_failure_markdown.sh > "$GITHUB_STEP_SUMMARY" || true
          truncate --size='<960K' "$GITHUB_STEP_SUMMARY" || true
          [ ! -f .failed ] || exit 1

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && !cancelled()
        continue-on-error: true
        with:
          name: Firmware
          path: |
            *.bin
            *.hex
            *.uf2

  publish:
    name: 'QMK Userspace Publish'
    if: github.ref == 'refs/heads/halcyon' && needs.build.result == 'success' && needs.regressions.result == 'success'
    needs: [build, regressions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Firmware

      - name: Validate firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            splitkb_halcyon_ferris_rev1_xtreemze_final_display.uf2
            splitkb_halcyon_ferris_rev1_xtreemze_final_encoder.uf2
          )

          for file in "${expected[@]}"; do
            test -s "$file" || {
              echo "Missing or empty expected firmware asset: $file" >&2
              exit 1
            }
          done

          mapfile -t actual < <(find . -maxdepth 1 -type f -name '*.uf2' -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo 'Firmware artifact contains an unexpected UF2 set; refusing to mutate latest release.' >&2
            exit 1
          fi

      - name: Move latest tag and clean stale assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const expectedAssets = new Set([
              'splitkb_halcyon_ferris_rev1_xtreemze_final_display.uf2',
              'splitkb_halcyon_ferris_rev1_xtreemze_final_encoder.uf2',
            ]);

            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'tags/latest',
                sha: context.sha,
                force: true,
              });
              core.info(`Moved latest tag to ${context.sha}.`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: 'refs/tags/latest',
                sha: context.sha,
              });
              core.info(`Created latest tag at ${context.sha}.`);
            }

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: 'latest',
              });
              for (const asset of release.assets) {
                if (!expectedAssets.has(asset.name)) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: asset.id,
                  });
                  core.info(`Deleted stale latest asset ${asset.name}.`);
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No existing latest release object; pinned release action will create it.');
            }

      - name: Generate moving latest release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ github.token }}
          name: Latest QMK Firmware
          tag_name: latest
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          files: |
            **/*.uf2
